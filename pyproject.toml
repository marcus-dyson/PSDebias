[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psdebias"
version = "0.1.0"
description = "Adaptive debiasing of quadratic spectral estimators (PSDebias)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Marcus Dyson" }]
keywords = ["spectral-density", "welch", "multitaper", "bayesian", "mcmc", "b-spline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "numba>=0.61",
]

[project.optional-dependencies]
scripts = ["tqdm", "matplotlib", "scienceplots"]

[tool.hatch.build.targets.wheel]
packages = ["src/psdebias"]
